name: TAVIQO CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  android-build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Decode google-services.json (from GitHub Secret)
        if: env.GOOGLE_SERVICES_JSON_B64 != ''
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: echo "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > app/google-services.json
      - name: Run Android Unit & Robolectric Tests
        run: ./gradlew :app:testDebugUnitTest
      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug

  firestore-rules-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Run Firestore Security Rules Suite
        run: firebase emulators:exec --only firestore "node --test firestore.test.js"

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Web Dependencies & Build
        run: npm install && npm run build
